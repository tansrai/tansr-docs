name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate + test (node 22 · pnpm 11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions 全部 pin 到 commit sha(供应链律);版本注释供人读
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # lastUpdated 读 git log,浅克隆会全部显示为「构建日」
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # check → build → gen:check → lint:text → links → frontmatter(首红即停)
      - run: pnpm gate

      - run: pnpm test
